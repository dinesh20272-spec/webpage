<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #667085;
      --paper: #f7f9fc;
      --line: rgba(23, 33, 43, 0.12);
      --coral: #ff6b5f;
      --mint: #22c7a9;
      --cobalt: #2f6fed;
      --gold: #f6b73c;
      --shadow: 0 24px 80px rgba(23, 33, 43, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(47, 111, 237, 0.13), transparent 38%),
        linear-gradient(315deg, rgba(34, 199, 169, 0.17), transparent 34%),
        var(--paper);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    main {
      width: min(1080px, calc(100vw - 32px));
      min-height: min(680px, calc(100vh - 32px));
      position: relative;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 28px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.9)),
        url("data:image/svg+xml,%3Csvg width='900' height='620' viewBox='0 0 900 620' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='900' height='620' fill='%23ffffff'/%3E%3Cg opacity='0.86'%3E%3Cpath d='M82 420C164 276 294 254 420 334C542 412 630 372 775 188L858 86V620H0V548C22 514 48 476 82 420Z' fill='%2322c7a9'/%3E%3Cpath d='M0 156C138 50 278 48 420 146C558 242 684 234 900 78V0H0V156Z' fill='%232f6fed'/%3E%3Cpath d='M236 620C350 492 470 452 596 500C698 540 784 520 900 424V620H236Z' fill='%23ff6b5f'/%3E%3Cpath d='M0 620V436C78 392 154 390 228 430C324 482 398 474 508 374C624 268 718 222 900 270V620H0Z' fill='%23f6b73c' opacity='0.78'/%3E%3C/g%3E%3Cg fill='none' stroke='%2317212b' stroke-opacity='0.13' stroke-width='2'%3E%3Cpath d='M78 114H238V274H78z'/%3E%3Cpath d='M662 356H822V516H662z'/%3E%3Ccircle cx='704' cy='142' r='76'/%3E%3Cpath d='M322 96l92 160 92-160H322z'/%3E%3C/g%3E%3C/svg%3E");
      background-size: cover;
      background-position: center;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background-image:
        linear-gradient(rgba(23, 33, 43, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 43, 0.055) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, transparent, black 16%, black 84%, transparent);
    }

    .panel {
      width: min(720px, 100%);
      padding: clamp(28px, 7vw, 72px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 20px 60px rgba(23, 33, 43, 0.13);
      backdrop-filter: blur(20px);
      text-align: center;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--coral), var(--gold));
      box-shadow: 0 0 0 5px rgba(255, 107, 95, 0.13);
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 15vw, 9.5rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    h1 span {
      display: block;
      background: linear-gradient(100deg, var(--ink) 0 34%, var(--cobalt) 42%, var(--mint) 66%, var(--coral) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 520px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 34px;
    }

    .page-links {
      margin-top: 0;
      margin-bottom: 28px;
    }

    .page-links a {
      min-height: 38px;
      padding: 0 14px;
      font-size: 0.9rem;
    }

    .page-links a[aria-current="page"] {
      color: white;
      border-color: transparent;
      background: var(--ink);
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      font-weight: 750;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    a.primary {
      border-color: transparent;
      color: white;
      background: linear-gradient(135deg, var(--cobalt), var(--mint));
      box-shadow: 0 14px 28px rgba(47, 111, 237, 0.24);
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(23, 33, 43, 0.14);
      background: white;
    }

    a.primary:hover {
      background: linear-gradient(135deg, var(--cobalt), var(--mint));
    }

    @media (max-width: 640px) {
      body {
        overflow: auto;
      }

      main {
        min-height: calc(100vh - 20px);
        width: calc(100vw - 20px);
        padding: 16px;
        border-radius: 20px;
      }

      .panel {
        border-radius: 18px;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      a {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Hello world landing page">
    <section class="panel">
      <nav class="actions page-links" aria-label="Main navigation">
        <a href="hello-world.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="kicker"><span class="mark"></span> Fresh start</div>
      <h1><span>Hello</span><span>World</span></h1>
      <p>A bright, modern little page with clean glass styling, vivid color, and a friendly first impression.</p>
      <div class="actions">
        <a class="primary" href="about.html" aria-label="Visit the about page">Start Exploring</a>
        <a href="contact.html" aria-label="Visit the contact page">Get in Touch</a>
      </div>
    </section>
  </main>
</body>
</html>
