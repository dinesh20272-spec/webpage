<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Hello World</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #667085;
      --paper: #f7f9fc;
      --line: rgba(23, 33, 43, 0.12);
      --coral: #ff6b5f;
      --mint: #22c7a9;
      --cobalt: #2f6fed;
      --gold: #f6b73c;
      --shadow: 0 24px 80px rgba(23, 33, 43, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(47, 111, 237, 0.13), transparent 38%),
        linear-gradient(315deg, rgba(34, 199, 169, 0.17), transparent 34%),
        var(--paper);
      display: grid;
      place-items: center;
    }

    main {
      width: min(1080px, calc(100vw - 32px));
      min-height: min(680px, calc(100vh - 32px));
      position: relative;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 28px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.9)),
        url("data:image/svg+xml,%3Csvg width='900' height='620' viewBox='0 0 900 620' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='900' height='620' fill='%23ffffff'/%3E%3Cg opacity='0.86'%3E%3Cpath d='M82 420C164 276 294 254 420 334C542 412 630 372 775 188L858 86V620H0V548C22 514 48 476 82 420Z' fill='%2322c7a9'/%3E%3Cpath d='M0 156C138 50 278 48 420 146C558 242 684 234 900 78V0H0V156Z' fill='%232f6fed'/%3E%3Cpath d='M236 620C350 492 470 452 596 500C698 540 784 520 900 424V620H236Z' fill='%23ff6b5f'/%3E%3Cpath d='M0 620V436C78 392 154 390 228 430C324 482 398 474 508 374C624 268 718 222 900 270V620H0Z' fill='%23f6b73c' opacity='0.78'/%3E%3C/g%3E%3Cg fill='none' stroke='%2317212b' stroke-opacity='0.13' stroke-width='2'%3E%3Cpath d='M78 114H238V274H78z'/%3E%3Cpath d='M662 356H822V516H662z'/%3E%3Ccircle cx='704' cy='142' r='76'/%3E%3Cpath d='M322 96l92 160 92-160H322z'/%3E%3C/g%3E%3C/svg%3E");
      background-size: cover;
      background-position: center;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background-image:
        linear-gradient(rgba(23, 33, 43, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 43, 0.055) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, transparent, black 16%, black 84%, transparent);
    }

    .panel {
      width: min(820px, 100%);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 20px 60px rgba(23, 33, 43, 0.13);
      backdrop-filter: blur(20px);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      font-size: 0.9rem;
      font-weight: 750;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    a[aria-current="page"] {
      color: white;
      border-color: transparent;
      background: var(--ink);
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(23, 33, 43, 0.14);
      background: white;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.4rem);
      line-height: 0.95;
      letter-spacing: 0;
      text-align: center;
      background: linear-gradient(100deg, var(--ink) 0 30%, var(--cobalt) 46%, var(--mint) 72%, var(--coral) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .intro {
      max-width: 620px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.75;
      text-align: center;
    }

    form {
      display: grid;
      gap: 14px;
      margin: 34px auto 0;
      max-width: 560px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-weight: 750;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.76);
      font: inherit;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(47, 111, 237, 0.55);
      box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.13);
      background: white;
    }

    button {
      min-height: 50px;
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, var(--cobalt), var(--mint));
      box-shadow: 0 14px 28px rgba(47, 111, 237, 0.24);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(47, 111, 237, 0.28);
    }

    @media (max-width: 720px) {
      main {
        min-height: calc(100vh - 20px);
        width: calc(100vw - 20px);
        padding: 16px;
        border-radius: 20px;
      }

      .panel {
        border-radius: 18px;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      a {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Contact page">
    <section class="panel">
      <nav class="actions" aria-label="Main navigation">
        <a href="hello-world.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
      <h1>Contact Us</h1>
      <p class="intro">Have an idea, a question, or just want to say hello? Send a note from this clean little contact page.</p>
      <form>
        <label>
          Name
          <input type="text" name="name" placeholder="Your name">
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com">
        </label>
        <label>
          Message
          <textarea name="message" placeholder="Write your message here"></textarea>
        </label>
        <button type="button">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
